{% extends "base.html" %}
{% block title %}My Favorites{% endblock %}
{% block content %}
<h1>My Favorites</h1>
{% if favorites %}
  <div class="cards">
    {% for f in favorites %}
      <div class="card">
        <span>Saved place ({{ f.provider }} · {{ f.place_id }})</span>
        <form method="post" action="{{ url_for('favorites_remove', favorite_id=f.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn remove">Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>No favorites yet. Find something and save it!</p>
{% endif %}
{% endblock %}
