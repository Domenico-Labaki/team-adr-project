{% extends "base.html" %}
{% block title %}My Favorites{% endblock %}
{% block content %}
<h1>My Favorites</h1>
{% if favorites %}
  <div class="cards">
    {% for f in favorites %}
      <div class="card">
        <p>{{ f.provider }} · {{ f.place_id }}</p>
        <form method="post" action="{{ url_for('favorites_remove') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="favorite_id" value="{{ f.id }}">
          <button class="btn remove">Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>No favorites yet.</p>
{% endif %}
{% endblock %}
